<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find a playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#fffafc;--surface:#fff;--ink:#4a2b52;--muted:#8a7494;--line:#f6d9e8;--accent:#ff6fa8;--accent-ink:#c2336f;--mark:#ffe0ef;--av-l:88%;--av-t:32%;--glow:rgba(255,111,168,.25);--g1:#ffd1e6;--g2:#e6d6ff;--g3:#c7e9ff;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1424;--surface:#281d33;--ink:#fbeaff;--muted:#b9a3c6;--line:#43304f;--accent:#ff8cbc;--accent-ink:#ffa9cd;--mark:#5a2a47;--av-l:34%;--av-t:90%;--glow:rgba(0,0,0,.4);--g1:#6a2f55;--g2:#43326e;--g3:#2b4a68;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:68rem;margin:0 auto;padding:0 1rem}
.hero{position:relative;isolation:isolate;margin:2.6rem auto 0;max-width:66rem;padding:2.4rem 1.4rem 1.8rem;border-radius:1.8rem;text-align:center;background:linear-gradient(120deg,var(--g1),var(--g2) 52%,var(--g3));border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to bottom,rgba(255,255,255,.5),rgba(255,255,255,0) 55%);pointer-events:none;z-index:-1}
.bow{position:absolute;top:-1.7rem;left:50%;translate:-50% 0;width:4.6rem;height:auto;filter:drop-shadow(0 3px 0 rgba(255,255,255,.55))}
h1{margin:0;font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:clamp(2rem,7vw,3.3rem);line-height:1.05;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.hero p{margin:.55rem 0 0;font-size:1.02rem;font-weight:700}
.sp{position:absolute;width:1.4rem;height:1.4rem;fill:#fff;animation:tw 2.8s ease-in-out infinite alternate}
.s1{left:7%;top:24%}.s2{left:19%;bottom:16%;width:.9rem;height:.9rem;animation-delay:.9s}.s3{right:9%;top:26%;width:1.7rem;height:1.7rem;animation-delay:.4s}.s4{right:21%;bottom:18%;width:1rem;height:1rem;animation-delay:1.5s}
@keyframes tw{from{opacity:.35;scale:.7}to{opacity:1;scale:1.1}}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:1rem 0 .6rem}
.field{position:relative}
.field svg{position:absolute;left:1.1rem;top:50%;translate:0 -50%;width:1.2rem;height:1.2rem;color:var(--accent)}
.search{width:100%;font:inherit;font-size:1.1rem;padding:.85rem 1.2rem .85rem 3rem;border:3px solid transparent;border-radius:999px;color:var(--ink);background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,#ff9ec6,#b99cff,#7cc8ff) border-box}
.search::placeholder{color:var(--muted)}
.search:focus{outline:none;box-shadow:0 0 0 5px var(--glow)}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem;margin-top:.75rem}
.chips{display:flex;gap:.45rem;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;font-size:.9rem;padding:.35rem 1rem;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,255,255,.8)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#ffc9df,#ff9cc6);border-color:#ff9cc6;color:#4a2b52;box-shadow:inset 0 2px 0 rgba(255,255,255,.65)}
#count{font-size:.9rem;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:.6rem 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12rem),1fr));gap:1rem}
a.card{position:relative;display:flex;flex-direction:column;height:100%;padding:.5rem;background:var(--surface);border:2px solid var(--line);border-radius:1.4rem;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:hsl(var(--h) 85% 76%);box-shadow:0 8px 18px var(--glow)}
a.card::after{content:"\2726";position:absolute;top:.9rem;right:1rem;font-size:1rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);opacity:0;transition:opacity .15s}
a.card:hover::after{opacity:1}
.img{position:relative;aspect-ratio:16/9;border-radius:1rem;overflow:hidden;display:grid;place-items:center;background:hsl(var(--h) 85% var(--av-l));color:hsl(var(--h) 45% var(--av-t));font-family:"Fredoka",system-ui,sans-serif;font-weight:600;font-size:2rem}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.35),rgba(255,255,255,0) 45%);pointer-events:none}
.info{display:flex;flex-direction:column;flex:1;padding:.55rem .35rem .3rem}
.info b{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.info i{font-style:normal;color:var(--muted);font-size:.86rem}
.c{margin-top:auto;padding-top:.45rem}
.c span{display:inline-block;font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;padding:.15rem .6rem;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent-ink)}
mark{background:var(--mark);color:inherit;border-radius:.2rem}
.empty{margin:2rem 0;color:var(--muted)}
footer{padding:1.5rem 0 2rem;font-size:.85rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.sp{animation:none}a.card{transition:none}a.card:hover{transform:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="star" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></symbol></svg>
<header class="hero">
<svg class="bow" viewBox="0 0 64 42" aria-hidden="true"><g stroke="#fff" stroke-width="2.5" stroke-linejoin="round"><path d="M32 20C24 5 6 1 3 12c-2 10 15 14 29 8z" fill="#ff9ec4"/><path d="M32 20C40 5 58 1 61 12c2 10-15 14-29 8z" fill="#ff9ec4"/><path d="M30 24 21 40M34 24l9 16" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="32" cy="20" r="6.5" fill="#ff6fa8"/></g><path d="M10 12c4-4 10-3 15 2M54 12c-4-4-10-3-15 2" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
<svg class="sp s1" aria-hidden="true"><use href="#star"/></svg><svg class="sp s2" aria-hidden="true"><use href="#star"/></svg><svg class="sp s3" aria-hidden="true"><use href="#star"/></svg><svg class="sp s4" aria-hidden="true"><use href="#star"/></svg>
<h1>Find a playlist</h1><p>Search by group or artist, for example “straykids” or “nayeon”.</p>
</header>
<div class="wrap">
<div class="sticky">
<div class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="q" class="search" type="search" placeholder="Search a group or artist" aria-label="Search a group or artist" autocomplete="off"></div>
<div class="bar">
<div class="chips" role="group" aria-label="Filter"><button class="chip" data-m="all" aria-pressed="true">All</button><button class="chip" data-m="grp" aria-pressed="false">Groups</button><button class="chip" data-m="mem" aria-pressed="false">Artists</button></div>
<span id="count" aria-live="polite">Loading…</span>
</div></div>
<main><ul id="list"></ul><p id="empty" class="empty" hidden></p></main>
<footer>Updated automatically from YouTube.</footer>
</div>
<script>
const CHANNEL_SEARCH="https://www.youtube.com/@lil_giorgia3301/search?query=";
const $=id=>document.getElementById(id);
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US");
const HUES=[340,15,45,150,195,225,260,300];
// "all JISOO (blackpink) youtube video [continuously updating]" -> "JISOO (blackpink)"
const clean=t=>t.replace(/\s*\[continuously updating\]\s*$/i,"").replace(/^all\s+/i,"").replace(/\s+youtube videos?/i,"").replace(/'/g,"’").trim();
function mk(d){
  const name=clean(d.title);
  const p=name.match(/\(([^)]*)\)/), mem=!!p&&!/japan|new and old/.test(p[1]);
  const title=mem?name.replace(/\s*\(.*\)/,""):name;
  const key=(mem?p[1]:name.replace(/\s*\(.*\)/,"")).toLowerCase();
  let h=0;for(const c of key)h=(h*31+c.charCodeAt(0))%997;
  return{name,n:d.count,id:d.id,thumb:/^https:\/\//.test(d.thumb||"")?d.thumb:null,mem,title,sub:mem?p[1]:"",hue:HUES[h%8],ini:title.replace(/[^\p{L}\p{N}]/gu,"").slice(0,2).toUpperCase()};
}
let ALL=[],mode="all";
function hl(text,words){
  let h=esc(text);
  words.forEach(w=>{if(!w)return;const r=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+")(?![^<]*>)","gi");h=h.replace(r,"<mark>$1</mark>");});
  return h;
}
function render(){
  const raw=$("q").value.trim();
  const words=norm(raw).split(/\s+/).filter(Boolean);
  const hw=raw.split(/\s+/).filter(Boolean);
  const items=ALL.filter(x=>words.every(w=>norm(x.name).includes(w))&&(mode==="all"||(mode==="mem")===x.mem));
  $("list").innerHTML=items.map(x=>{
    const href=x.id?"https://www.youtube.com/playlist?list="+encodeURIComponent(x.id):CHANNEL_SEARCH+encodeURIComponent("all "+x.name.replace(/’/g,"'"));
    return '<li><a class="card" style="--h:'+x.hue+'" href="'+href+'" target="_blank" rel="noopener"><span class="img"><span aria-hidden="true">'+esc(x.ini)+'</span>'+(x.thumb?'<img src="'+esc(x.thumb)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+'</span><span class="info"><b>'+hl(x.title,hw)+'</b>'+(x.sub?'<i>'+hl(x.sub,hw)+'</i>':'')+'<span class="c"><span>'+fmt(x.n)+(x.n===1?' video':' videos')+'</span></span></span></a></li>';
  }).join("");
  $("count").textContent=items.length+" of "+ALL.length;
  const e=$("empty");
  e.hidden=items.length>0;
  if(!items.length)e.textContent="No playlists found for “"+raw+"”. Try the name of a group or an artist.";
}
$("list").addEventListener("error",e=>{if(e.target.tagName==="IMG")e.target.remove();},true);
$("q").addEventListener("input",render);
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
  mode=b.dataset.m;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
  render();
}));
fetch("playlists.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(j=>{
  ALL=j.map(mk).sort((a,b)=>a.name.localeCompare(b.name,"en"));
  const nMem=ALL.filter(x=>x.mem).length;
  const L={all:"All ("+ALL.length+")",grp:"Groups ("+(ALL.length-nMem)+")",mem:"Artists ("+nMem+")"};
  document.querySelectorAll(".chip").forEach(b=>b.textContent=L[b.dataset.m]);
  render();
}).catch(()=>{
  $("count").textContent="";
  const e=$("empty");e.hidden=false;e.textContent="Could not load the playlists. Please try again later.";
});
</script>
</body>
</html>
